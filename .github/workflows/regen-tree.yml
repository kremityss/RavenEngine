# file: .github/workflows/regen-tree.yml
# regenerates the Theos tree from write_tree.py, patches Src/Aimbot.mm
# with the root-level aimbot_fixed.mm, verifies the marker, commits.
# only line that matters for the aimbot patch: the grep -q string.
# if your step names differ, swap them — the grep string is the contract.

name: Regen Theos Tree

on:
  push:
    paths:
      - 'aimbot_fixed.mm'
      - 'write_tree.py'
      - 'config.json'
      - 'sync_offsets.py'
      - '.github/workflows/regen-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Theos tree
        run: python3 write_tree.py

      - name: Patch Src/Aimbot.mm
        run: cp aimbot_fixed.mm Src/Aimbot.mm

      - name: Verify marker present
        run: grep -q "Root cause fix" Src/Aimbot.mm

      - name: Commit regenerated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "regen tree: patch Aimbot.mm [skip ci]" || echo "no changes to commit"
          git push
